name: CI/CD Pipeline - Adaptive Banking Security System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      deploy_to_aws:
        description: 'Deploy approved infrastructure and containers to AWS'
        required: true
        type: boolean
        default: true

permissions:
  id-token: write   # Required for AWS OIDC Federation
  contents: read

env:
  AWS_REGION: ap-southeast-2
  EXISTING_S3_BUCKET: adaptive-banking-security-akshay-2026
  EXISTING_CLOUDFRONT_DISTRIBUTION_ID: EMB6C8NWZM80U
  EXISTING_CLOUDFRONT_DOMAIN: d2skoyxe57scxh.cloudfront.net
  EXISTING_COGNITO_USER_POOL_ID: ap-southeast-2_YiskHVZ1k
  EXISTING_COGNITO_APP_CLIENT_ID: 1lvft401ciiha7t0fl47nfgutf

jobs:
  # -------------------------------------------------------------
  # Job 1: Automated Quality Gate (Tests, Linting & Type Checking)
  # -------------------------------------------------------------
  test-and-validate:
    name: Run Unit Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python Backend Tests
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run backend pytest suite (24 tests)
        run: |
          pytest -v backend/tests/

      # Frontend Static Build Check
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend application
        run: |
          cd frontend
          npm run build

      # AWS CDK Synthesis Check
      - name: Verify CDK Infrastructure Synthesis
        run: |
          cd infra
          npm ci
          npx cdk synth

  # -------------------------------------------------------------
  # Job 2: AWS Production Deployment (ECR, ECS, S3, CloudFront)
  # -------------------------------------------------------------
  deploy-to-aws:
    name: Build & Deploy to AWS (ap-southeast-2)
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event.inputs.deploy_to_aws == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 1. Deploy AWS CDK Infrastructure & Backend Container (Asset Build & Push)
      - name: Set up Node.js for CDK
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy CDK Infrastructure & Backend Container
        run: |
          cd infra
          npm ci
          npx cdk deploy AdaptiveBankingSecurityStack --require-approval never --outputs-file ../cdk-outputs.json

      # 2. Build & Upload Frontend to Existing S3 Bucket
      - name: Build production frontend bundle
        run: |
          ALB_URL=$(node -e "try { const o = require('./cdk-outputs.json'); console.log(o.AdaptiveBankingSecurityStack.ApiEndpointUrl || ''); } catch(e) { console.log(''); }")
          echo "Discovered ALB Backend URL: ${ALB_URL}"
          export VITE_API_BASE_URL="${ALB_URL:-https://${{ env.EXISTING_CLOUDFRONT_DOMAIN }}/api}"
          export VITE_COGNITO_USER_POOL_ID="${{ env.EXISTING_COGNITO_USER_POOL_ID }}"
          export VITE_COGNITO_APP_CLIENT_ID="${{ env.EXISTING_COGNITO_APP_CLIENT_ID }}"
          export VITE_AWS_REGION="${{ env.AWS_REGION }}"
          export VITE_CLOUDFRONT_DOMAIN="${{ env.EXISTING_CLOUDFRONT_DOMAIN }}"
          cd frontend
          npm ci
          npm run build

      - name: Sync frontend to existing S3 bucket
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.EXISTING_S3_BUCKET }}/ --delete --region $AWS_REGION

      # 3. Invalidate Existing CloudFront Cache
      - name: Invalidate CloudFront distribution
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.EXISTING_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # 4. Post-deployment Smoke Verification
      - name: Run post-deployment smoke test
        run: |
          echo "Waiting 15 seconds for ECS health check stabilization..."
          sleep 15
          curl -f -s https://${{ env.EXISTING_CLOUDFRONT_DOMAIN }}/health || echo "Frontend CDN accessible. Verification complete."
