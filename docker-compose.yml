version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - USE_MOCK_DB=true
      - AWS_REGION=ap-southeast-2
      - DYNAMODB_TABLE_NAME=AdaptiveBankingTransactions
      - COGNITO_USER_POOL_ID=ap-southeast-2_YiskHVZ1k
      - COGNITO_APP_CLIENT_ID=1lvft401ciiha7t0fl47nfgutf
    volumes:
      - ./backend/artifacts:/app/artifacts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
