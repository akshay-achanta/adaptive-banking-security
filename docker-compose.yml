services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adaptive-banking-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,https://d2skoyxe57scxh.cloudfront.net
      - USE_MOCK_DB=true
      - AWS_REGION=ap-southeast-2
      - DYNAMODB_TABLE_NAME=AdaptiveBankingTransactions
      - COGNITO_USER_POOL_ID=ap-southeast-2_YiskHVZ1k
      - COGNITO_APP_CLIENT_ID=1lvft401ciiha7t0fl47nfgutf
      - REQUIRE_AUTH=false
    volumes:
      - ./backend/artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adaptive-banking-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_AWS_REGION=ap-southeast-2
      - VITE_COGNITO_USER_POOL_ID=ap-southeast-2_YiskHVZ1k
      - VITE_COGNITO_APP_CLIENT_ID=1lvft401ciiha7t0fl47nfgutf
      - VITE_CLOUDFRONT_DOMAIN=d2skoyxe57scxh.cloudfront.net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
